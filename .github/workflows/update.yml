name: 每日更新并发布

on:
  schedule:
    - cron: "17 14 * * *"  # 美西时间早上 7:17（冬令时 6:17）
    - cron: "37 18 * * *"  # 美西时间上午 11:37（冬令时 10:37），备用
  workflow_dispatch:        # 可在 Actions 页面手动运行
  push:
    branches: [main]        # 修改网页或配置后自动重新发布（这时不抓取）

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并整理资讯
        if: github.event_name != 'push'
        env:
          TZ_OFFSET_HOURS: "-7"   # 按美西时间划分日期
        run: python scripts/update.py

      - name: 保存到仓库
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data
          if git diff --cached --quiet; then
            echo "没有新内容"
          else
            git commit -m "资讯更新 $(TZ=America/Los_Angeles date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
